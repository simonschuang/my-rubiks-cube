<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik's Cube 3D</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="ui-container">
        <h1>Rubik's 3D</h1>
        <div class="controls-info">
            <p><strong>Rotate Cube:</strong> Left Click + Drag Background</p>
            <p><strong>Rotate Layer:</strong> Left Click + Drag Cube Face</p>
        </div>
        <div class="button-group">
            <button id="btn-scan">Scan Face</button>
            <button id="btn-scramble">Scramble</button>
            <button id="btn-solve">Solve</button>
            <button id="btn-reset">Reset</button>
        </div>
    </div>
    <div id="canvas-container"></div>

    <!-- Scanner Modal -->
    <div id="scanner-modal" class="hidden">
        <div class="scanner-content">
            <h2>Scan Cube Face</h2>
            <div class="video-wrapper">
                <video id="scanner-video" autoplay playsinline></video>
                <div class="scanner-grid">
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
            <div class="scanner-controls">
                <button id="btn-capture">Capture</button>
                <button id="btn-close-scanner" class="secondary">Close</button>
            </div>
            <p class="scanner-tip">Align the face with the grid. Ensure good lighting.</p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
